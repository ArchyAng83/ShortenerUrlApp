server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Serve the pre-compressed .gz publishing sidecars (~3x smaller first load).
    gzip_static on;

    # Security headers (server level; locations below that set their own add_header
    # must repeat them because nginx does not merge add_header across levels).
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Content-hashed Blazor framework assets: safe to cache forever, but never
    # let a missing file fall through to index.html — it must fail as a real 404.
    # '^~' keeps the regex block below from overriding these headers.
    location ^~ /_framework/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
    }

    # index.html decides which hashed assets this build uses, so it must
    # always revalidate; otherwise browsers keep booting stale builds.
    location = / {
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
    }
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
    }

    # Unhashed assets (appsettings.json, css/, js/, _content/MudBlazor/*, scoped *.styles.css)
    # keep the same URL across deploys — force revalidation via ETag.
    location ~* \.(css|json)$ {
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
    }

    # Client-side routes: SPA fallback to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
