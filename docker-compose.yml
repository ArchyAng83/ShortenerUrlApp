services:
  postgres:
    image: postgres:16-alpine
    container_name: shortener-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-UrlShortenerDb}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shortener-net

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required} --appendonly yes
    container_name: shortener-redis
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shortener-net

  api:
    build:
      context: .
      dockerfile: ShortenerUrl.WebApi/Dockerfile
      args:
        # Optional MaxMind license key; empty means the image falls back to the P3TERX mirror.
        MAXMIND_LICENSE_KEY: ${MAXMIND_LICENSE_KEY:-}
    container_name: shortener-api
    environment:
      # Keep CORS in sync with the published UI port/origin (index 0 of Cors:AllowedOrigins).
      - Cors__AllowedOrigins__0=${UI_ORIGIN:-http://localhost:${UI_PORT:-5209}}
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=${POSTGRES_DB:-UrlShortenerDb};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - ConnectionStrings__Redis=redis:6379,password=${REDIS_PASSWORD:?REDIS_PASSWORD is required},abortConnect=false,connectTimeout=10000,connectRetry=5,ssl=${REDIS_SSL:-false}
      - Redis__Ssl=${REDIS_SSL:-false}
      - JwtSettings__Secret=${JWT_SECRET:?JWT_SECRET is required}
      - JwtSettings__Issuer=${JWT_ISSUER:-ShortenerUrlApp}
      - JwtSettings__Audience=${JWT_AUDIENCE:-ShortenerUrlApp}
      - JwtSettings__ExpiryMinutes=${JWT_EXPIRY_MINUTES:-60}
      - GeoIp__DatabasePath=${GEOIP_DATABASE_PATH:-Data/GeoLite2-City.mmdb}
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
      - ASPNETCORE_ALLOWEDHOSTS=${ALLOWED_HOSTS:-}
    ports:
      - "${API_PORT:-5153}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - shortener-net

  ui:
    build:
      context: .
      dockerfile: ShortenerUrlApp.WebUI/Dockerfile
    container_name: shortener-ui
    ports:
      - "${UI_PORT:-5209}:8080"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - shortener-net

volumes:
  postgres_data:
  redis_data:

networks:
  shortener-net:
    driver: bridge
